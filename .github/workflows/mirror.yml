name: Mirror from hyperbook.cloud

on:
  # Runs hourly
  schedule:
    - cron: "0 * * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Mirroring pushes back into this repository
permissions:
  contents: write
  actions: write

# Never run two mirrors at the same time; queued runs go through afterwards.
concurrency:
  group: mirror-from-cloud
  cancel-in-progress: false

jobs:
  mirror:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Mirroring needs the full history of this repository.
          fetch-depth: 0

      - name: Fetch from hyperbook.cloud
        env:
          HBC_USER: ${{ secrets.HBC_USER }}
          HBC_PASSWORD: ${{ secrets.HBC_PASSWORD }}
        run: |
          git config --global credential.helper \
            '!f() { printf "username=%s\npassword=%s\n" "$HBC_USER" "$HBC_PASSWORD"; }; f'
          # Remember the current tags so we can detect changes (and new tags) later.
          git tag --list | sort > "$RUNNER_TEMP/tags-before.txt"

          git remote add cloud https://hyperbook.cloud/api/books/4/git
          git fetch --prune cloud \
            "+refs/heads/*:refs/remotes/cloud/*" \
            "+refs/tags/*:refs/tags/*"

      - name: Push to GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_in_sync=0
          if [ "$(git rev-parse refs/remotes/cloud/main)" = "$(git rev-parse refs/remotes/origin/main)" ]; then
            main_in_sync=1
          fi

          git tag --list | sort > "$RUNNER_TEMP/tags-after.txt"
          tags_in_sync=0
          if cmp -s "$RUNNER_TEMP/tags-before.txt" "$RUNNER_TEMP/tags-after.txt"; then
            tags_in_sync=1
          fi

          if [ "$main_in_sync" = 1 ] && [ "$tags_in_sync" = 1 ]; then
            echo "main and tags are already in sync with hyperbook.cloud"
            exit 0
          fi

          if [ "$main_in_sync" = 0 ]; then
            git push --force origin "refs/remotes/cloud/main:refs/heads/main"
          fi

          if [ "$tags_in_sync" = 0 ]; then
            git push --force --prune origin "refs/tags/*:refs/tags/*"
          fi

          # Pushes made with GITHUB_TOKEN do not trigger the Pages deploy
          # (on: push of a tag), so start it explicitly for the newest new tag.
          comm -13 "$RUNNER_TEMP/tags-before.txt" "$RUNNER_TEMP/tags-after.txt" \
            | sort -V | tail -n 1 > "$RUNNER_TEMP/newest-tag.txt"
          if [ -s "$RUNNER_TEMP/newest-tag.txt" ]; then
            tag=$(cat "$RUNNER_TEMP/newest-tag.txt")
            echo "New tag detected: $tag"
            gh workflow run pages.yml --ref "$tag"
          else
            echo "No new tags; skipping the Pages deploy."
          fi
